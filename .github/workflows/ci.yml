# Lightweight CI inspired by AssetStocker gates + WarRoom cargo tests.
# Full Tauri Windows bundle is not built here (needs MSVC + WebView2).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build

  rust:
    runs-on: ubuntu-latest
    env:
      TOKENUSAGE_SKIP_TOKSCALE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test (lib + risk_scenarios)
        working-directory: src-tauri
        run: |
          cargo test --lib
          cargo test --test risk_scenarios

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject private updater key in tree
        run: |
          if git ls-files | grep -E '(^|/)updater\.key$|(^|/)tmp/updater\.key$'; then
            echo "Private updater key must not be committed"
            exit 1
          fi
          if grep -RIn --exclude-dir=target --exclude-dir=node_modules \
              -e 'BEGIN.*PRIVATE KEY' -e 'rsign encrypted secret key' \
              --include='*.rs' --include='*.ts' --include='*.json' --include='*.md' . ; then
            echo "Possible private key material in tracked sources"
            exit 1
          fi
          echo "OK"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKENUSAGE_SKIP_TOKSCALE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.31.5
      - name: Coverage gate
        run: bash scripts/coverage.sh
