[package]
name = "token-usage"
version = "0.1.6"
description = "Token Usage floating widget for coding agents"
authors = ["you"]
edition = "2021"

[lib]
name = "token_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Coverage gate focuses on business logic; GUI bootstrap is excluded via scripts/coverage.sh
[package.metadata.tarpaulin]
exclude-files = [
  "src/main.rs",
  "src/lib.rs",
  "src/commands.rs",
  "src/state.rs",
  "src/application/*",
  "src/infrastructure/window_ctl.rs",
  "src/infrastructure/updater.rs",
  "src/infrastructure/providers/claude.rs",
  "src/infrastructure/providers/codex.rs",
  "src/infrastructure/providers/grok.rs",
  "src/infrastructure/providers/paths.rs",
  "src/infrastructure/providers/mod.rs",
  "src/infrastructure/providers/tokscale_exec.rs",
]



